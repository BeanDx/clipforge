# Лендинг (site/) на GitHub Pages. Скриншоты берутся из docs/, чтобы не хранить их дважды.
# Один раз включить: Settings → Pages → Source: GitHub Actions.
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          mkdir -p _site/shots
          # всё из site/, кроме служебных скриптов
          rsync -a --exclude "*.mjs" --exclude "*.cmd" --exclude "README.md" site/ _site/
          cp docs/screenshots/*.webp _site/shots/
          cp docs/banner.webp _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
